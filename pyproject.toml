[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-audio"
version = "0.1.0"
description = "Converte o texto de PDFs em audio usando Kokoro TTS."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "kokoro>=0.9.2",
    "pypdf>=5.0.0",
    "soundfile>=0.13.0",
]

[project.scripts]
pdf-to-audio = "pdf_to_audio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
